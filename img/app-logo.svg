<?xml version="1.0" encoding="UTF-8"?>
<svg width="36px" height="36px" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c7dff" />
      <stop offset="100%" stop-color="#bd93f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Фоновый круг -->
  <circle cx="18" cy="18" r="17" fill="#232639" stroke="url(#logoGradient)" stroke-width="2" />
  
  <!-- Клетки для списка задач -->
  <rect x="10" y="9" width="16" height="3" rx="1" fill="url(#logoGradient)" filter="url(#glow)" />
  <rect x="10" y="15" width="16" height="3" rx="1" fill="url(#logoGradient)" filter="url(#glow)" opacity="0.8" />
  <rect x="10" y="21" width="16" height="3" rx="1" fill="url(#logoGradient)" filter="url(#glow)" opacity="0.6" />
  
  <!-- Чекбоксы -->
  <circle cx="7" cy="10.5" r="2" fill="white" />
  <circle cx="7" cy="16.5" r="2" fill="white" />
  <circle cx="7" cy="22.5" r="2" fill="white" />
  
  <!-- Чек-марки для чекбоксов -->
  <path d="M5.5 10.5 L6.5 11.5 L8.5 9.5" stroke="#bd93f9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M5.5 16.5 L6.5 17.5 L8.5 15.5" stroke="#bd93f9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>